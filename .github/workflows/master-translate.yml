name: Master Hy-MT2 Game Translation

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/**'

permissions:
  contents: read

env:
  MODEL_FILE: model/HY-MT2-7B-Q8_0.gguf
  MODEL_URL: https://huggingface.co/tencent/Hy-MT2-7B-GGUF/resolve/main/HY-MT2-7B-Q8_0.gguf?download=true
  MODEL_SIZE: '7981928896'
  MODEL_CACHE_KEY: hymt2-7b-q8-7981928896-v1
  LLAMA_SERVER: .cache/tools/llama-server
  LLAMA_CACHE_KEY: llama-server-linux-x64-master-v1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - name: Python bağımlılıkları
        run: python3 -m pip install -r requirements.txt
      - name: İş yapılandırmasını ve kaynak dosyayı analiz et
        run: python3 prepare.py --config config/job.json --out-dir build
      - id: matrix
        name: Shard matrisi
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c=json.load(open('config/job.json',encoding='utf-8'))
          n=max(1,min(32,int(c.get('shards',12))))
          print('shards='+str(n))
          print('matrix='+json.dumps(list(range(n)),separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-work
          path: build/
          retention-days: 7

  prepare-model:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Hy-MT2 model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: model/HY-MT2-7B-Q8_0.gguf
          key: ${{ env.MODEL_CACHE_KEY }}
      - name: Modeli yalnız cache yoksa Hugging Face'ten indir
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          curl -fL --retry 8 --retry-delay 10 --connect-timeout 30 -o "$MODEL_FILE" "$MODEL_URL"
          test "$(stat -c%s "$MODEL_FILE")" = "$MODEL_SIZE"

  prepare-llama:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: llama-server cache
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: .cache/tools/llama-server
          key: ${{ env.LLAMA_CACHE_KEY }}
      - name: llama-server yalnız cache yoksa derle
        if: steps.llama-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/tools
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libcurl4-openssl-dev git
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DLLAMA_CURL=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/llama.cpp/build -j4 --target llama-server
          cp /tmp/llama.cpp/build/bin/llama-server "$LLAMA_SERVER"
          chmod +x "$LLAMA_SERVER"

  translate:
    needs: [prepare, prepare-model, prepare-llama]
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prepared-work
          path: build
      - name: Hy-MT2 model cache yükle
        uses: actions/cache@v4
        with:
          path: model/HY-MT2-7B-Q8_0.gguf
          key: ${{ env.MODEL_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: llama-server cache yükle
        uses: actions/cache@v4
        with:
          path: .cache/tools/llama-server
          key: ${{ env.LLAMA_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: llama-server başlat
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$LLAMA_SERVER"
          "$LLAMA_SERVER" -m "$MODEL_FILE" --host 127.0.0.1 --port 8080 --jinja -ngl 0 -t 4 -tb 4 -c 8192 -np 2 > "llama-${{ matrix.shard }}.log" 2>&1 &
          echo $! > llama.pid
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && exit 0
            kill -0 "$(cat llama.pid)" 2>/dev/null || { cat "llama-${{ matrix.shard }}.log"; exit 1; }
            sleep 5
          done
          cat "llama-${{ matrix.shard }}.log"; exit 1
      - name: Çeviri + ikinci kalite kontrolü
        run: |
          python3 translate.py \
            --config config/job.json \
            --items build/work_items.jsonl \
            --server http://127.0.0.1:8080 \
            --shard "${{ matrix.shard }}" \
            --shards "${{ needs.prepare.outputs.shards }}" \
            --workers 2 \
            --cache "cache-${{ matrix.shard }}.jsonl" \
            --notes "notes-${{ matrix.shard }}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            cache-${{ matrix.shard }}.jsonl
            notes-${{ matrix.shard }}.jsonl
            llama-${{ matrix.shard }}.log
          retention-days: 7
          if-no-files-found: error

  finalize:
    needs: translate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Python bağımlılıkları
        run: python3 -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: caches
          merge-multiple: true
      - name: Nihai dosyayı oluştur
        run: python3 finalize.py --config config/job.json --cache-dir caches
      - name: Yapı + token doğrulaması
        run: python3 validate.py --config config/job.json --warnings output/validation_warnings.txt
      - name: Çeviri notlarını birleştir
        shell: bash
        run: |
          mkdir -p output
          find caches -name 'notes-*.jsonl' -type f -print0 | xargs -0 -r cat > output/translation_notes.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: MASTER_TRANSLATE_RESULT
          path: output/**
          retention-days: 30
          if-no-files-found: error
